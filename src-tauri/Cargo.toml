[package]
name = "firawynix-center"
version = "1.2.3"
edition = "2021"
description = "Firawynix Center — launcher dos jogos e projetos Firawynix"
license = "MIT"
repository = "https://github.com/firawynix/firawynix-center"

[features]
default = []
# Edição da Microsoft Store: biblioteca/atalhos sem baixar ou instalar código.
store = []

[lib]
name = "firawynix_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# atualização do próprio launcher: pacote assinado (minisign), instala quieto e reabre
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls: sem OpenSSL para empacotar, e o launcher só fala HTTPS
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "time"] }
sha2 = "0.10"
hex = "0.4"
url = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
